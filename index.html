<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>html,body{height:100%}body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
</head>
<body>
<title>아이폰 16 시뮬레이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 화면 가운데 아이폰 16 (393×852pt) 한 대. 폰 화면 폭(≤500px)에서는 기기 자체가 화면 전체가 된다. */
:root{
  --page:#e7e4df; --page-ink:#6b665e; --bezel:#101113; --bezel-edge:#3a3b3f;
  --ios-blue:#007aff; --ios-green:#34c759; --ios-red:#ff3b30; --ios-orange:#ff9500;
  --ios-label:#000; --ios-label2:rgba(60,60,67,.6); --ios-label3:rgba(60,60,67,.3);
  --ios-bg:#fff; --ios-gray6:#f2f2f7; --ios-gray5:#e5e5ea; --ios-gray4:#d1d1d6; --ios-sep:rgba(60,60,67,.2);
  --bubble-me:#0b84ff; --bubble-them:#e9e9eb;
  --kakao-yellow:#fee500; --kakao-bg:#b2c7da; --kakao-ink:#3c1e1e; --kakao-time:#556677;
  --glass:rgba(255,255,255,.22); --glass-strong:rgba(250,250,252,.72); --glass-line:rgba(255,255,255,.28);
  --im-sent:#0078ff; --im-recv:#e9e9eb; --im-gray:#909093; --im-blue:#3478f6; --im-head:#f1f1f2; --im-line:#c5c5c7; --im-plus:#e8e9eb; --im-plus-ink:#7d7f85; --im-mic:#b4b8bf;
  --white:#fff; --black:#000; --lock-wall:none;
  --noti-bg:rgba(236,236,238,.62); --noti-peek:rgba(225,225,228,.45); --noti-time:rgba(60,60,67,.62);
  --wall: radial-gradient(110% 60% at 28% 22%, #ead2ab 0%, rgba(234,210,171,0) 58%),
          radial-gradient(90% 55% at 82% 88%, #f1ebe2 0%, rgba(241,235,226,0) 62%),
          linear-gradient(165deg, #2f3b55 0%, #56617a 46%, #b59d84 100%);
  --font:-apple-system,"SF Pro Text",BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --font-round:ui-rounded,"SF Pro Rounded",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --page:#141416; --page-ink:#8f8a83; color-scheme:dark } }
:root[data-theme="dark"]{ --page:#141416; --page-ink:#8f8a83; color-scheme:dark }

html,body{height:100%}
body{background:var(--page);color:var(--page-ink);font-family:var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--ios-blue);outline-offset:2px}
#stage{height:100%;display:grid;place-items:center;overflow:hidden}
#device{position:relative;width:393px;height:852px;border:13px solid var(--bezel);border-radius:68px;box-shadow:0 0 0 2px var(--bezel-edge),0 40px 80px -30px rgba(0,0,0,.45);transform-origin:center;box-sizing:content-box;flex:none}
.sidekey{position:absolute;width:5px;border-radius:3px;background:var(--bezel-edge)}
#sideBtn{right:-20px;top:220px;height:96px;cursor:pointer}
.vol1{left:-20px;top:180px;height:60px}.vol2{left:-20px;top:250px;height:60px}.act{left:-20px;top:120px;height:32px}
#screen{position:relative;width:100%;height:100%;border-radius:55px;overflow:hidden;overflow:clip;background:var(--black);color:var(--white);touch-action:none;user-select:none;-webkit-user-select:none;font-family:var(--font)}
@media (max-width:500px){
  #device{width:100vw;height:100%;border:0;border-radius:0;box-shadow:none;transform:none!important}
  #screen{border-radius:0}
  .sidekey{display:none}
}

/* 공통 레이어 */
#wall{position:absolute;inset:0;background:var(--wall);background-size:cover;background-position:center top;transition:filter .4s, transform .5s}
.layer{position:absolute;inset:0}
.island{position:absolute;top:11px;left:50%;width:124px;height:36px;margin-left:-62px;background:var(--black);border-radius:20px;z-index:200;pointer-events:none}
#status{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 44px;z-index:190;pointer-events:none;color:var(--white);font-weight:600;font-size:17px;transition:color .3s}
#status.dark{color:var(--black)}
#status .st-time{width:70px;text-align:center;letter-spacing:-.2px;padding-top:2px}
#status .st-icons{display:flex;gap:6px;align-items:center;padding-top:2px}
#status svg{display:block;fill:currentColor}
#status.hide-time .st-time{visibility:hidden}
#homebar{position:absolute;bottom:0;left:0;right:0;height:34px;z-index:180;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;box-sizing:border-box;cursor:grab}
#homebar i{display:block;width:134px;height:5px;border-radius:3px;background:var(--white);transition:background .3s}
#homebar.dark i{background:var(--black)}
#homebar[hidden]{display:none}

/* 잠금화면 */
#lock{z-index:60;background:var(--black) var(--lock-wall) 12% center/cover no-repeat;will-change:transform;--lp:0}
#lock.away{transform:translateY(-100%);opacity:0;pointer-events:none}
/* 쓸어올리는 정도(--lp: 0~1)에 따라 시계·알림이 천천히 따라오며 흐려져요 */
.lk-date,.lk-time{translate:0 calc(var(--lp)*150px);scale:calc(1 - var(--lp)*.12);opacity:calc(1 - var(--lp)*1.5)}
.lk-notis{translate:0 calc(var(--lp)*60px);opacity:calc(1 - var(--lp)*1.8)}
.lk-btn,.lk-cc{opacity:calc(1 - var(--lp)*3)}
.lk-cc{position:absolute;top:66px;right:22px;width:48px;height:2.5px;border-radius:2px;background:var(--white);opacity:.35}
.lk-date{position:absolute;top:76px;left:0;right:0;height:28px;text-align:center;font-size:21px;font-weight:500;color:var(--white);letter-spacing:.2px;text-shadow:0 1px 8px rgba(0,0,0,.2)}
.lk-date > span{position:absolute;inset:0;line-height:28px;white-space:nowrap;transition:opacity .9s ease, filter .9s ease, translate .9s ease}
.lk-date .lk-hint{font-size:18px;opacity:0;filter:blur(4px);translate:0 4px;text-shadow:0 1px 3px rgba(0,0,0,.45),0 0 12px rgba(0,0,0,.25)}
.lk-date.hinting #lkDate{opacity:0;filter:blur(4px);translate:0 -4px}
.lk-date.hinting .lk-hint{opacity:1;filter:none;translate:0 0}
.lk-date .lk-hint{animation:hintFloat 3s ease-in-out infinite;will-change:transform;backface-visibility:hidden}
@keyframes hintFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.lk-time{position:absolute;top:94px;width:100%;text-align:center;font-family:var(--font);font-size:100px;font-weight:600;letter-spacing:-2px;line-height:1.1;color:var(--white);text-shadow:0 1px 14px rgba(0,0,0,.18);font-variant-numeric:tabular-nums}
.lk-notis{position:absolute;left:8px;right:8px;bottom:118px;display:flex;flex-direction:column;gap:8px}
.noti-wrap{position:relative;will-change:translate,transform;backface-visibility:hidden;animation:notiIn .5s both, notiFloat 5s ease-in-out infinite}
@keyframes notiFloat{0%,100%{translate:0 0}50%{translate:0 -2px}}
.noti-wrap.stacked{padding-bottom:16px}
.noti-peek{position:absolute;left:12px;right:12px;top:60px;height:14px;border-radius:0 0 18px 18px;background:var(--noti-peek);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.noti-peek.p2{left:24px;right:24px;top:68px;opacity:.75}
.noti{position:relative;display:flex;gap:10px;align-items:center;height:66px;padding:0 14px;border-radius:24px;background:var(--noti-bg);color:var(--black);backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);text-align:left;width:100%;box-sizing:border-box}
.noti .ico{width:38px;height:38px;border-radius:8.5px;flex:none}
.noti .nt{flex:1;min-width:0}
.noti b{display:block;font-size:15px;font-weight:600;line-height:20px}
.noti span{display:block;font-size:15px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.noti em{font-style:normal;font-size:13px;color:var(--noti-time);align-self:flex-start;padding-top:13px}
@keyframes notiIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.lk-btn{position:absolute;bottom:50px;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.26);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transition:transform .15s,background .2s,color .2s}
.lk-btn:active{transform:scale(1.15)}
.lk-btn svg{width:22px;height:22px;fill:currentColor}
#flash{left:46px}#cam{right:46px}
.lk-btn svg{width:20px;height:20px}
#flash.on{background:var(--white);color:var(--black)}

/* 암호 입력 */
#passcode{z-index:58;--pp:1;opacity:0;pointer-events:none;transition:opacity .3s;display:flex;flex-direction:column;align-items:center;overflow:hidden}
#passcode::before{content:"";position:absolute;inset:-40px;background:var(--black) var(--lock-wall) 12% center/cover no-repeat;filter:blur(30px) brightness(.62) saturate(1.3);z-index:-1}
#passcode{isolation:isolate}
#passcode > :not(.pc-msg){opacity:var(--pp);scale:calc(1.1 - var(--pp)*.1)}
#passcode .keypad{translate:0 calc((1 - var(--pp))*40px)}
#passcode.show{opacity:1;pointer-events:auto}
#passcode.done{opacity:0;transform:scale(1.08);transition:opacity .35s,transform .45s}
.pc-lock{margin-top:70px;width:22px;height:28px;fill:var(--white)}
.pc-title{margin-top:44px;font-size:21px;font-weight:500}
.pc-dots{display:flex;gap:24px;margin-top:22px;height:14px}
.pc-dots i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--white);transition:background .1s}
.pc-dots i.on{background:var(--white)}
.pc-dots.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}
.pc-msg{height:20px;margin-top:16px;font-size:14px;color:var(--white);opacity:0;transition:opacity .2s;text-align:center}
.pc-msg.show{opacity:.95}
.keypad{display:grid;grid-template-columns:repeat(3,78px);gap:16px 26px;margin-top:auto;margin-bottom:28px}
.key{width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .25s;touch-action:manipulation}
.key:active,.key.press{background:rgba(255,255,255,.5);transition:none}
.key b{font-size:36px;font-weight:400;line-height:1;font-variant-numeric:tabular-nums}
.key small{font-size:10px;font-weight:600;letter-spacing:2.2px;margin-top:2px;min-height:12px}
.pc-foot{display:flex;justify-content:space-between;width:100%;padding:0 52px 46px;box-sizing:border-box;font-size:17px}

/* 홈 화면 */
#home{z-index:10;transition:transform .4s cubic-bezier(.2,.85,.25,1),filter .4s,opacity .4s}
#home.behind{transform:scale(.92);filter:brightness(.7)}
#home.locked{opacity:0;transform:scale(1.12)}
#pagesWrap{position:absolute;top:58px;left:0;right:0;bottom:132px;overflow:hidden}
#pages{display:flex;height:100%;will-change:transform}
.page{flex:none;width:100%;height:100%;box-sizing:border-box;padding:12px 20px 0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(6,minmax(0,1fr));max-height:648px;align-content:start}
.cell{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;min-width:0}
.cell .lbl{margin-top:5px;font-size:12px;font-weight:500;text-shadow:0 1px 4px rgba(0,0,0,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:84px}
.iw{position:relative;width:62px;height:62px;flex:none}
.ico{width:100%;height:100%;border-radius:14px;display:grid;place-items:center;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.ico svg{width:64%;height:64%}
.ico img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:-6px;right:-8px;min-width:24px;height:24px;padding:0 7px;box-sizing:border-box;border-radius:12px;background:var(--ios-red);color:var(--white);font-size:14px;font-weight:500;display:grid;place-items:center;font-variant-numeric:tabular-nums;z-index:2}
.badge[hidden]{display:none}
/* 캘린더 아이콘: 오늘 요일·날짜가 실시간으로 바뀌어요 */
.ico .cal{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;line-height:1;color:var(--black);font-family:var(--font)}
.cal-day{margin-top:7.5px;font-size:12.5px;font-weight:500;color:var(--ios-red);letter-spacing:.1px}
.cal-date{margin-top:1px;font-size:39px;font-weight:300;letter-spacing:-1.5px;font-variant-numeric:normal}
.bounce{animation:bounce .45s}
@keyframes bounce{30%{transform:scale(.86)}65%{transform:scale(1.06)}}
.app-btn:active .iw{filter:brightness(.8)}
#home.intro .cell,#home.intro #dock{animation:homeIn .55s cubic-bezier(.2,.85,.25,1) both}
@keyframes homeIn{from{transform:scale(1.25);opacity:0}}
.widget{grid-column:span 2;grid-row:span 2;padding:6px 8px 22px}
.wcard{height:100%;border-radius:22px;padding:14px 15px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;text-align:left}
.w-music{background:linear-gradient(160deg,#ff5f6d,#f53b57);color:var(--white)}
.w-music .art{width:56px;height:56px;border-radius:7px;background:linear-gradient(135deg,#2a2a2a,#7a5c46 60%,#e8d3b5);display:grid;place-items:end start;padding:5px;box-sizing:border-box;font-size:9px;font-weight:700;letter-spacing:.5px;color:rgba(255,255,255,.85);flex:none}
.w-music .note{position:absolute;right:15px;top:14px;width:18px;height:18px;fill:var(--white)}
.w-music b{margin-top:auto;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-music span{font-size:13px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-music .play{margin-top:8px;align-self:flex-start;padding:5px 13px;border-radius:14px;background:rgba(255,255,255,.22);font-size:14px;font-weight:600;display:flex;gap:6px;align-items:center}
.w-music .play svg{width:11px;height:11px;fill:var(--white)}
.w-rem{background:var(--white);color:var(--ios-label)}
.w-rem header{display:flex;justify-content:space-between;align-items:baseline}
.w-rem header b{color:var(--ios-blue);font-size:15px;font-weight:600}
.w-rem header strong{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}
.w-rem ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
.w-rem li button{display:flex;gap:9px;align-items:center;width:100%;font-size:13.5px;text-align:left}
.w-rem li i{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ios-gray4);flex:none;box-sizing:border-box}
.w-rem li.done i{background:var(--ios-blue);border-color:var(--ios-blue);box-shadow:inset 0 0 0 3px var(--white)}
.w-rem li.done span{color:var(--ios-label2)}
.w-rem li span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.widget.wide{grid-column:span 4}
.w-weather{background:linear-gradient(180deg,#3d8fe0,#7ab8f0);color:var(--white)}
.w-weather .top{display:flex;justify-content:space-between}
.w-weather .city{font-size:15px;font-weight:600}
.w-weather .deg{font-size:40px;font-weight:300;line-height:1.1}
.w-weather .cond{text-align:right;font-size:13px;font-weight:500}
.w-weather .hours{margin-top:auto;display:flex;justify-content:space-between;font-size:12px;font-weight:500;text-align:center}
.w-weather .hours div{display:flex;flex-direction:column;gap:4px;align-items:center}
.w-weather .hours svg{width:20px;height:20px}
#searchPill{position:absolute;bottom:118px;left:50%;transform:translateX(-50%);height:30px;padding:0 14px;border-radius:15px;background:rgba(120,120,128,.32);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500}
#searchPill svg{width:13px;height:13px;fill:var(--white)}
#searchPill .dots{display:none;gap:8px}
#searchPill .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4)}
#searchPill .dots i.on{background:var(--white)}
#searchPill.paging .s{display:none}#searchPill.paging .dots{display:flex}
#dock{position:absolute;left:12px;right:12px;bottom:12px;height:94px;border-radius:32px;background:var(--glass);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);box-shadow:inset 0 0 0 .5px var(--glass-line);display:grid;grid-template-columns:repeat(4,1fr);justify-items:center;align-items:center;padding:0 8px}
#dock .app-btn{display:block}
#dock .iw{display:block}

/* 앱 공통 */
.app{z-index:40;background:var(--ios-bg);color:var(--ios-label);opacity:0;transform:scale(.15);pointer-events:none;transition:transform .42s cubic-bezier(.2,.9,.25,1),opacity .25s;border-radius:40px;overflow:hidden;overflow:clip}
.app.open{opacity:1;transform:none;pointer-events:auto;border-radius:0}
.nav{position:absolute;inset:0;overflow:hidden;overflow:clip}
.pane{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--ios-bg);transition:transform .38s cubic-bezier(.2,.85,.25,1)}
.pane.chat{transform:translateX(100%);box-shadow:-10px 0 30px rgba(0,0,0,.08)}
.nav.in-chat .pane.chat{transform:none}
.nav.in-chat .pane.list{transform:translateX(-28%)}
.scroll{flex:1;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.topbar{padding:56px 16px 0;display:flex;justify-content:space-between;align-items:center;color:var(--ios-blue);font-size:17px;height:44px;box-sizing:content-box}
.topbar svg{width:24px;height:24px;fill:currentColor}
.bigtitle{font-size:34px;font-weight:700;padding:2px 16px 8px;letter-spacing:.2px}
.searchbox{margin:0 16px 8px;height:36px;border-radius:10px;background:var(--ios-gray6);color:var(--ios-label2);display:flex;align-items:center;gap:6px;padding:0 8px;font-size:17px}
.searchbox svg{width:15px;height:15px;fill:var(--ios-label2)}
.rows{list-style:none;margin:0;padding:0}

/* 메시지 */
#app-messages .row{display:flex;gap:12px;align-items:center;padding:10px 16px 0 6px;width:100%;text-align:left}
#app-messages .row .udot{width:10px;height:10px;border-radius:50%;flex:none;margin-left:2px}
#app-messages .row.unread .udot{background:var(--ios-blue)}
.avatar{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;color:var(--white);font-weight:600;font-size:17px;background:linear-gradient(180deg,#a8aebb,#858b98)}
#app-messages .row .rt{flex:1;min-width:0;border-bottom:.5px solid var(--ios-sep);padding-bottom:10px}
#app-messages .row .r1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#app-messages .row b{font-size:17px;font-weight:600}
#app-messages .row time{font-size:15px;color:var(--ios-label2);white-space:nowrap}
#app-messages .row p{margin:2px 0 0;font-size:15px;color:var(--ios-label2);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chathead{padding-top:50px;display:flex;align-items:flex-start;justify-content:center;position:relative;background:rgba(249,249,249,.94);border-bottom:.5px solid var(--ios-sep);padding-bottom:8px;flex:none}
.chathead .back{position:absolute;left:8px;top:58px;color:var(--ios-blue);display:flex;align-items:center;font-size:17px}
.chathead .back svg{width:22px;height:22px;fill:currentColor}
.chathead .who{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--ios-label)}
.chathead .who .avatar{width:50px;height:50px;font-size:20px}
.msgs{padding:10px 14px 12px;display:flex;flex-direction:column;gap:2px}
.daystamp{text-align:center;font-size:11px;color:var(--ios-label2);margin:6px 0 10px}
.daystamp b{font-weight:600}
.b{max-width:74%;padding:7px 12px;border-radius:18px;font-size:17px;line-height:1.3;word-break:break-word;white-space:pre-wrap;animation:pop .25s both}
.b.me{align-self:flex-end;background:var(--bubble-me);color:var(--white)}
.b.them{align-self:flex-start;background:var(--bubble-them);color:var(--ios-label)}
.b.me.tail{border-bottom-right-radius:5px}.b.them.tail{border-bottom-left-radius:5px}
.b.gap{margin-top:8px}

/* 페이지 넘기기 (터치·마우스 드래그) */
let page = 0, pagerMoved = false;
(function pager(){
  const wrap = $('#pagesWrap'), track = $('#pages'), pill = $('#searchPill');
  let sx=0, sy=0, dx=0, down=false, horiz=null, pillT;
  const W = () => wrap.clientWidth;
  const go = (p, anim=true) => {
    page = Math.max(0, Math.min(1, p));
    track.style.transition = anim ? 'transform .38s cubic-bezier(.2,.85,.25,1)' : 'none';
    track.style.transform = `translateX(${-page*W()}px)`;
    $$('#searchPill .dots i').forEach((d,i)=>d.classList.toggle('on', i===page));
    pill.classList.add('paging'); clearTimeout(pillT); pillT = setTimeout(()=>pill.classList.remove('paging'), 1300);
  };
  wrap.addEventListener('pointerdown', e => { down=true; sx=e.clientX; sy=e.clientY; dx=0; horiz=null; pagerMoved=false; });
  window.addEventListener('pointermove', e => {
    if(!down) return;
    const s = scaleNow(); const mx=(e.clientX-sx)/s, my=(e.clientY-sy)/s;
    if(horiz===null && (Math.abs(mx)>6||Math.abs(my)>6)) horiz = Math.abs(mx) > Math.abs(my);
    if(!horiz) return;
    pagerMoved = true; dx = mx;
    let off = -page*W() + dx;
    if (off > 0) off *= .35; if (off < -W()) off = -W() + (off + W()) * .35;
    track.style.transition='none'; track.style.transform=`translateX(${off}px)`;
    pill.classList.add('paging');
  });
  window.addEventListener('pointerup', () => {
    if(!down) return; down=false;
    if(horiz){ if(dx < -W()*.18) go(page+1); else if(dx > W()*.18) go(page-1); else go(page); }
    setTimeout(()=>pagerMoved=false, 30);
  });
  window.addEventListener('resize', ()=>go(page,false));
  window.goPage = go;
})();

/* ---------- 쫀득한 잠금 해제 제스처 ----------
   손가락을 1:1로 따라오고, 놓으면 스프링(살짝 출렁)으로 마무리돼요.
   빠르게 튕기거나 화면의 1/4 이상 올리면 열리고, 아니면 제자리로 쫀득하게 돌아와요. */
const lockEl = $('#lock'), pcEl = $('#passcode'), homeEl = $('#home');
let lockY = 0, lockMode = 'passcode', springRaf = 0;
const SH = () => screenEl.offsetHeight;
const rubber = d => 70 * (1 - Math.exp(-d / 140));          // 아래로 당길 때 고무줄 저항
function renderLock(y){
  lockY = y;
  const h = SH(), p = Math.min(1, Math.max(0, -y / h));
  const yy = y > 0 ? rubber(y) : y;
  lockEl.style.transform = `translate3d(0,${yy}px,0)`;
  lockEl.style.setProperty('--lp', p.toFixed(4));
  if (y > 0) lockEl.style.setProperty('--lp', 0);
  if (lockMode === 'passcode'){
    pcEl.style.opacity = 1;
    pcEl.style.setProperty('--pp', Math.min(1, Math.max(0, (p - .08) * 1.5)).toFixed(4));
  } else {
    homeEl.style.transform = `scale(${(1.08 - .08 * p).toFixed(4)})`;
    homeEl.style.filter = `brightness(${(.6 + .4 * p).toFixed(3)})`;
  }
}
function beginLock(mode){
  cancelAnimationFrame(springRaf); lockMode = mode;
  lockEl.classList.remove('away');
  if (mode === 'home'){ homeEl.style.transition = 'none'; }
}
function clearLockStyles(){
  lockEl.style.transform = ''; lockEl.style.removeProperty('--lp');
  pcEl.style.opacity = ''; pcEl.style.removeProperty('--pp');
  homeEl.style.transform = ''; homeEl.style.filter = ''; homeEl.style.transition = '';
}
function spring(from, v0, to, onDone, k = 290, c = 27){
  cancelAnimationFrame(springRaf);
  let x = from, v = v0, last = performance.now();
  const step = t => {
    const dt = Math.min(.034, (t - last) / 1000); last = t;
    for (let i = 0; i < 4; i++){ const a = -k * (x - to) - c * v; v += a * dt / 4; x += v * dt / 4; }
    renderLock(x);
    if (Math.abs(x - to) < .4 && Math.abs(v) < 6){ renderLock(to); onDone && onDone(); return; }
    springRaf = requestAnimationFrame(step);
  };
  springRaf = requestAnimationFrame(step);
}
function settleOpen(){        // 다 올라간 뒤 최종 상태로
  lockEl.classList.add('away');
  if (lockMode === 'passcode'){ pcEl.classList.add('show'); st.screen = 'passcode'; }
  else { st.screen = 'home'; }
  clearLockStyles(); chrome();
}
function settleClosed(){      // 제자리로 돌아온 뒤
  const wasMode = lockMode;
  clearLockStyles();
  if (wasMode === 'passcode') pcEl.classList.remove('show');
  if (st.screen !== 'cover') st.screen = 'lock';
  chrome();
}
(function lockSwipe(){
  let sy = 0, down = false, moved = false, samples = [];
  lockEl.addEventListener('pointerdown', e => {
    if (st.screen !== 'lock' && st.screen !== 'cover') return;
    down = true; moved = false; sy = e.clientY; samples = [[performance.now(), 0]];
    beginLock(st.screen === 'cover' ? 'home' : 'passcode');
    if (lockMode === 'passcode') preparePasscode();
    try { lockEl.setPointerCapture(e.pointerId); } catch(_){}
  });
  lockEl.addEventListener('pointermove', e => {
    if (!down) return;
    const dy = (e.clientY - sy) / scaleNow();
    if (Math.abs(dy) > 6) moved = true;
    samples.push([performance.now(), dy]); if (samples.length > 6) samples.shift();
    renderLock(dy);
  });
  const up = () => {
    if (!down) return; down = false;
    const a = samples[0], b = samples[samples.length - 1];
    const vel = b && a && b[0] > a[0] ? (b[1] - a[1]) / ((b[0] - a[0]) / 1000) : 0;   // px/s
    const y = lockY, h = SH();
    lockEl.dataset.moved = moved ? '1' : '';
    setTimeout(() => lockEl.dataset.moved = '', 30);
    if (!moved){ settleClosed(); if (st.screen === 'lock') showHint(); return; }
    if ((vel < -450 || y < -h * .22) && vel < 350){ haptic(8); spring(y, Math.min(vel, -900), -h, settleOpen, 320, 34); }
    else spring(y, vel, 0, settleClosed);
  };
  lockEl.addEventListener('pointerup', up); lockEl.addEventListener('pointercancel', up);
})();

function bindComposer(app, form, input, btn){
  input.addEventListener('input', () => btn.classList.toggle('on', !!input.value.trim()));
  form.addEventListener('submit', e => {
    e.preventDefault(); const text = input.value.trim(); if(!text || !cur[app]) return;

    const t = S[app][cur[app]];
    t.msgs.push({ me:true, text, time:korTime(now()), read:false, fresh:true }); t.ts = seq++;

function findRule(app, id, text){
  const rules = CONFIG.replies.filter(r => r.app===app && (!r.thread || r.thread===id));
  return rules.find(r => r.match !== '*' && [].concat(r.match).some(k => text.includes(k)))
      || rules.find(r => r.match === '*');
}
async function runReplies(app, id, text){
  const rule = findRule(app, id, text); const t = S[app][id];
  if (!rule) return;
  await sleep(rule.delay ?? 1000);
  t.msgs.forEach(m => { if (m.me) m.read = true; });
  if (isViewing(app,id)) renderChat(app);
  for (const r of [].concat(rule.reply)){
    if (app==='sms'){ t.typing = true; if (isViewing(app,id)) renderChat(app); }
    await sleep(Math.min(800 + r.length * 75, 3200));
    t.typing = false;
    receive(app, id, r);
    await sleep(450);
  }
}
const isViewing = (app,id) => st.screen === (app==='sms'?'messages':'kakao') && cur[app] === id;
function receive(app, id, text){
  const t = S[app][id];
  t.msgs.push({ me:false, text, time:korTime(now()), read:true, fresh:true }); t.ts = seq++;
  if (isViewing(app,id)) { renderChat(app); haptic(6); }
  else { t.unread++; updateBadges(); banner(app, id, text); if (st.screen===(app==='sms'?'messages':'kakao')) renderList(app); }
}

  if (st.screen==='lock'||st.screen==='passcode') return;
  el.innerHTML = `${iconHTML(appKey)}<span class="nt"><b>${esc(threadName(t))}</b><span>${esc(text)}</span></span><em>지금</em>`;
  el.classList.add('show'); haptic([10,60,10]);
  el.onclick = () => { el.classList.remove('show'); if (st.screen==='call') return; openApp(appKey, null); openThread(app, id, false); };
  clearTimeout(banner.t); banner.t = setTimeout(()=>el.classList.remove('show'), 4200);
}

  if (tab==='recents'){ renderRecents(); st.missed = 0; updateBadges(); }
  if (tab==='fav') renderFav();
  if (tab==='contacts') renderContacts();
}
$('#phTabs').addEventListener('click', e => { const b=e.target.closest('[data-tab]'); if(b){ haptic(6); showTab(b.dataset.tab); } });
const telIcon = '<svg class="glyph" viewBox="0 0 24 24">'+PH.replace('fill="#fff"','')+'</svg>';
function renderRecents(){
  $('#recentList').innerHTML = st.recents.map((r,i) => {
    const c = contactById(r.contact), n = c ? c.name : r.number;
    return `<li><button class="ph-row ${r.type==='missed'?'missed':''}" data-call="${i}">${r.type==='out'?telIcon:'<span style="width:14px"></span>'}<span class="rt"><span><b>${esc(n)}</b><small>휴대전화</small></span><time>${esc(r.time)}<span class="info">i</span></time></span></button></li>`;
  }).join('');
}
$('#recentList').addEventListener('click', e => { const b=e.target.closest('[data-call]'); if(!b) return; const r=st.recents[+b.dataset.call]; startCall(r.contact ? {contact:r.contact} : {number:r.number}); });
function renderFav(){
  $('#favList').innerHTML = CONFIG.contacts.filter(c=>c.fav).map(c=>`<li><button class="ph-row" data-cid="${c.id}"><span class="avatar">${esc(initial(c.name))}</span><span class="rt"><span><b>${esc(c.name)}</b><small>휴대전화</small></span><span class="info">i</span></span></button></li>`).join('');
}
function renderContacts(){
  const list = CONFIG.contacts.slice().sort((a,b)=>a.name.localeCompare(b.name,'ko'));
  $('#contactScroll').innerHTML = `<div class="mycard"><span class="avatar">${esc(initial(CONFIG.me.name))}</span><span><b>${esc(CONFIG.me.name)}</b><small>내 카드 · ${esc(CONFIG.me.phone)}</small></span></div>
    <ul class="rows">${list.map(c=>`<li><button class="ph-row" data-cid="${c.id}"><span class="rt" style="padding:12px 0"><b style="font-weight:500">${esc(c.name)}</b></span></button></li>`).join('')}</ul>`;
}
$('#app-phone').addEventListener('click', e => { const b=e.target.closest('[data-cid]'); if(b){ haptic(6); startCall({contact:b.dataset.cid}); } });

let dial = '';
const digits = s => s.replace(/\D/g,'');
function fmtNum(n){ const d=digits(n); if(d.length===11) return `${d.slice(0,3)}-${d.slice(3,7)}-${d.slice(7)}`; if(d.length>=8 && d.startsWith('02')) return `02-${d.slice(2,-4)}-${d.slice(-4)}`; return n; }
function renderDial(){
  $('#dialNum').textContent = fmtNum(dial);
  const c = CONFIG.contacts.find(c=>digits(c.phone)===digits(dial));
  $('#dialName').textContent = c ? c.name : (dial.length>3 ? '번호 추가' : '');
  $('#dialDel').hidden = !dial;
}
buildPad($('#dialPad'), k => { if(dial.length<15){ dial+=k; renderDial(); } });
$('#dialDel').addEventListener('click', () => { haptic(6); dial = dial.slice(0,-1); renderDial(); });
$('#dialCall').addEventListener('click', () => {
  haptic(12); if(!dial) return;
  const c = CONFIG.contacts.find(c=>digits(c.phone)===digits(dial));
  startCall(c ? {contact:c.id} : {number:fmtNum(dial)}); dial=''; renderDial();
});

let callToken = 0, timerI = null;
async function startCall(target){
  const my = ++callToken;
  const c = target.contact ? contactById(target.contact) : null;
  const name = c ? c.name : target.number;
  const script = (c && CONFIG.calls[c.id]) || CONFIG.calls.default;
  $('#cName').textContent = name; $('#cStatus').textContent = '휴대전화 연결 중…'; $('#captions').innerHTML='';
  $$('#call .c-btn').forEach(b=>b.classList.remove('on'));
  $('#call').classList.add('show'); st.prev = st.screen; st.screen='call'; chrome();
  st.recents.unshift({ contact: c?.id, number: c?null:name, type:'out', time: korTime(now()) });
  await sleep(script.ring ?? 3000); if (my!==callToken) return;
  if (script.noAnswer || !script.lines){ $('#cStatus').textContent = '응답 없음'; haptic(30); await sleep(1600); if(my===callToken) endCall(); return; }
  haptic(25);
  const t0 = Date.now();
  const upd = () => { const s=Math.floor((Date.now()-t0)/1000); $('#cStatus').textContent = `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; };
  upd(); timerI = setInterval(upd, 500);
  for (const line of script.lines){
    await sleep(line.wait ?? 700); if (my!==callToken) return;
    await caption(line, name, my); if (my!==callToken) return;
  }
  await sleep(1800); if (my!==callToken) return;
  endCall();
}
async function caption(line, name, my){
  const box = $('#captions');
  $$('#captions .cap').forEach(c=>c.classList.add('old'));
  while (box.children.length > 2) box.firstElementChild.remove();
  const el = document.createElement('div');
  el.className = 'cap ' + (line.who==='me'?'me':'them');
  el.innerHTML = `<small>${esc(line.who==='me' ? CONFIG.me.name : name)}</small><p></p>`;
  box.appendChild(el);
  const p = el.querySelector('p');
  for (const ch of [...line.text]){ if (my!==callToken) return; p.textContent += ch; await sleep(55); }
  await sleep(Math.min(600 + line.text.length*45, 2600));
}
function endCall(silent){
  callToken++; clearInterval(timerI);
  if (!$('#call').classList.contains('show')) return;
  if (!silent){ $('#cStatus').textContent = '통화 종료'; haptic(20); }
  setTimeout(() => {
    $('#call').classList.remove('show');
    if (st.screen==='call'){ st.screen = st.prev || 'phone'; chrome(); }
    if (st.screen==='phone' && currentTab==='recents') renderRecents();
  }, silent ? 0 : 700);
}
$('#endCall').addEventListener('click', () => endCall());
$$('#call .c-btn[data-tg]').forEach(b => b.addEventListener('click', () => { haptic(8); b.classList.toggle('on'); }));

/* 입력칸 포커스 때 화면이 옆으로 밀리지 않게 */
[screenEl, ...$$('.nav'), ...$$('.app')].forEach(el => el.addEventListener('scroll', () => { el.scrollLeft = 0; el.scrollTop = 0; }));
/* ---------- 시작 ---------- */
document.documentElement.style.setProperty('--lock-wall', `url("${CONFIG.lockWallpaper || DEFAULT_LOCK_WALL}")`);
{ const u = `url("${CONFIG.wallpaper || DEFAULT_WALL}")`; $('#wall').style.backgroundImage = u; $('#call .cbg').style.backgroundImage = u; }
renderHome(); renderLockNotis(); renderDots(); renderDial(); updateBadges(); tick(); setInterval(tick, 1000); fit(); chrome();
</script>
