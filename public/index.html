<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon.png">
<title>내 아이폰 홈 화면</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
html,body{margin:0}
/* Layout: on a computer, one phone centered on a quiet stage; on a phone, the screen alone fills the display edge to edge. */
:root{
  --stage:#ebeaef; --ink:#2b2931; --muted:#76727e; --chip:#ffffffcc; --chip-line:#d8d6de;
  --ios:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --blue:#007aff;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--stage:#111014;--ink:#eceaf1;--muted:#8f8b98;--chip:#1e1d23cc;--chip-line:#2e2c34;color-scheme:dark}}
:root[data-theme="dark"]{--stage:#111014;--ink:#eceaf1;--muted:#8f8b98;--chip:#1e1d23cc;--chip-line:#2e2c34;color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--stage);color:var(--ink);font-family:var(--ios);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box;overflow:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.phone{position:relative;width:min(calc((100dvh - 96px) * 900 / 1840), calc(100vw - 32px), 440px);aspect-ratio:900/1840;max-width:100%;
  background:url(base.png) center/100% 100% no-repeat;touch-action:manipulation;filter:drop-shadow(0 18px 40px rgba(0,0,0,.18))}
.phone > *{position:absolute}
.crop{background-image:url(home.png);background-repeat:no-repeat}
.tile{border-radius:22.6%;cursor:pointer;transition:filter .12s ease;will-change:transform}
.tile.pressed{filter:brightness(.68)}
.badge{border-radius:999px;pointer-events:none;transition:opacity .25s, transform .25s}
.badge.gone{opacity:0;transform:scale(.4)}
.jiggle .tile,.jiggle .badge{animation:jig .28s ease-in-out infinite alternate}
@keyframes jig{from{transform:rotate(-1.8deg)}to{transform:rotate(1.8deg)}}
.hit{cursor:pointer;border-radius:12px}
.hit:focus-visible,.tile:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
/* widgets */
.pill{border-radius:999px;background:linear-gradient(180deg,#fb5e70,#f9465b);color:#fff;display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*10);
  font:600 calc(var(--u)*27)/1 var(--ios);pointer-events:none}
.pill svg{width:calc(var(--u)*22);height:calc(var(--u)*24)}
.check{border-radius:50%;background:var(--blue);display:grid;place-items:center;pointer-events:none;transform:scale(.3);opacity:0;transition:transform .22s cubic-bezier(.3,1.6,.5,1),opacity .15s}
.check.on{transform:scale(1);opacity:1}
.check svg{width:55%;height:55%}
.fade{background:#fff;opacity:0;pointer-events:none;transition:opacity .2s}
.fade.on{opacity:.62}
.count{background:#fff;color:#000;font:700 calc(var(--u)*44)/1 var(--ios);display:flex;align-items:center;justify-content:flex-end;letter-spacing:-.01em;pointer-events:none;font-variant-numeric:tabular-nums}
.eq{display:flex;align-items:flex-end;gap:calc(var(--u)*4);pointer-events:none;background:linear-gradient(180deg,#fb6c80,#fb677e)}
.eq i{flex:1;background:#fff;border-radius:2px;height:40%;animation:eq .5s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:-.2s}.eq i:nth-child(3){animation-delay:-.35s}.eq i:nth-child(4){animation-delay:-.1s}
@keyframes eq{to{height:100%}}
/* screen layer */
.screen{overflow:hidden;pointer-events:none;border-radius:14.2% / 6.6%}
.screen > *{pointer-events:auto}
.app{position:absolute;inset:0;transform-origin:0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*26);
  font-family:var(--ios);transition:transform .44s cubic-bezier(.22,.9,.24,1),border-radius .44s cubic-bezier(.22,.9,.24,1);overflow:hidden}
.app .bigicon{width:calc(var(--u)*200);height:calc(var(--u)*200);border-radius:22.6%;box-shadow:0 calc(var(--u)*10) calc(var(--u)*30) rgba(0,0,0,.15)}
.app h2{margin:0;font:700 calc(var(--u)*44)/1.2 var(--ios);letter-spacing:-.01em}
.app p{margin:0;font:400 calc(var(--u)*25)/1.5 var(--ios);opacity:.6;text-align:center;max-width:62%;text-wrap:balance;word-break:keep-all}
.app .inner{display:contents}
.app .time{position:absolute;top:calc(var(--u)*44);left:calc(var(--u)*106);font:600 calc(var(--u)*33)/1 var(--ios)}
.app .content{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*26);transition:opacity .25s}
.homebar{position:absolute;bottom:0;left:0;right:0;height:calc(var(--u)*110);display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(var(--u)*24);box-sizing:border-box;cursor:grab;touch-action:none}
.homebar span{width:calc(var(--u)*280);height:calc(var(--u)*11);border-radius:99px;background:currentColor;opacity:.85}
.done{position:absolute;top:calc(var(--u)*140);right:calc(var(--u)*50);font:600 calc(var(--u)*28)/1 var(--ios);color:#fff;background:rgba(60,60,67,.45);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:0;border-radius:99px;padding:calc(var(--u)*16) calc(var(--u)*30);cursor:pointer}
/* search */
.search{position:absolute;inset:0;background:rgba(20,20,26,.35);-webkit-backdrop-filter:blur(26px) saturate(1.3);backdrop-filter:blur(26px) saturate(1.3);
  display:flex;flex-direction:column;padding:calc(var(--u)*170) calc(var(--u)*50) 0;gap:calc(var(--u)*24);opacity:0;transition:opacity .25s;box-sizing:border-box}
.search.on{opacity:1}
.sfield{display:flex;align-items:center;gap:calc(var(--u)*14);background:rgba(255,255,255,.22);border-radius:calc(var(--u)*26);padding:0 calc(var(--u)*22);height:calc(var(--u)*80)}
.sfield svg{width:calc(var(--u)*28);flex:none}
.sfield input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font:400 calc(var(--u)*32)/1 var(--ios)}
.sfield input::placeholder{color:rgba(255,255,255,.65)}
.sfield button{background:none;border:0;color:#fff;font:400 calc(var(--u)*30)/1 var(--ios);cursor:pointer;padding:0}
.slabel{color:rgba(255,255,255,.75);font:600 calc(var(--u)*24)/1 var(--ios);margin-top:calc(var(--u)*10)}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:calc(var(--u)*30) calc(var(--u)*20)}
.sitem{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*10);background:none;border:0;cursor:pointer;color:#fff;font:400 calc(var(--u)*22)/1.2 var(--ios);padding:0}
.sitem span:first-child{width:calc(var(--u)*118);height:calc(var(--u)*118);border-radius:22.6%}
.sempty{color:rgba(255,255,255,.75);font:400 calc(var(--u)*27)/1.4 var(--ios)}
/* full-screen mode on phones */
body.full{background:#000;padding:0;display:block}
body.full::before{content:"";position:fixed;inset:-40px;background:url(base-full.jpg) center/cover;filter:blur(28px) brightness(.55)}
body.full .phone{position:fixed;max-width:none;filter:none;aspect-ratio:auto;background:url(base-full.jpg) no-repeat;background-size:89.5556% 95.0543%;background-position:50.0000% 50.5495%}
body.full .screen{border-radius:0}
body.full.standalone .frame-only,body.full.standalone .app .time{display:none}
body.full .homebar{padding-bottom:calc(var(--u)*70)}
/* lock screen */
.lock{position:absolute;inset:0;background:url(lock.jpg) center/100% 100% no-repeat;transition:transform .45s cubic-bezier(.22,.9,.24,1),opacity .45s;touch-action:none;cursor:grab}
body.full.standalone .lock{background-image:url(lock-clean.jpg)}
.lock.gone{transform:translateY(-100%);opacity:0;pointer-events:none}
.lock .lk{position:absolute;cursor:pointer;border-radius:calc(var(--u)*44)}
.lock .lk.round{border-radius:50%}
.torch{position:absolute;border-radius:50%;background:#fff;display:grid;place-items:center;pointer-events:none;opacity:0;transform:scale(.85);transition:opacity .18s,transform .25s cubic-bezier(.3,1.5,.5,1)}
.torch.on{opacity:1;transform:scale(1)}
.torch svg{width:42%;height:42%}
.relock{position:absolute;touch-action:none}
/* passcode */
.pin{position:absolute;inset:0;background:url(pin-bg.jpg) center/100% 100% no-repeat;color:#fff;font-family:var(--ios);opacity:0;pointer-events:none;transition:opacity .35s,transform .45s cubic-bezier(.22,.9,.24,1)}
.pin::before{content:"";position:absolute;inset:0;background:rgba(20,18,22,.28)}
.pin.on{opacity:1;pointer-events:auto}
.pin.out{opacity:0;transform:scale(1.08);pointer-events:none}
.pin > *{position:absolute}
.pin .prompt{left:0;right:0;text-align:center;font:400 calc(var(--u)*38)/1.25 var(--ios);letter-spacing:-.01em}
.pin .dots{left:0;right:0;display:flex;justify-content:center;gap:calc(var(--u)*50)}
.pin .dots i{width:calc(var(--u)*26);height:calc(var(--u)*26);border-radius:50%;border:calc(var(--u)*2.6) solid #fff;box-sizing:border-box;transition:background .12s}
.pin .dots i.f{background:#fff}
.pin .dots.shake{animation:shake .42s}
@keyframes shake{20%,60%{transform:translateX(calc(var(--u)*-26))}40%,80%{transform:translateX(calc(var(--u)*26))}}
.key{width:calc(var(--u)*157);height:calc(var(--u)*157);margin:calc(var(--u)*-78.5) 0 0 calc(var(--u)*-78.5);border-radius:50%;border:0;padding:0;cursor:pointer;color:#fff;
  background:radial-gradient(120% 120% at 30% 20%,rgba(255,255,255,.34),rgba(255,255,255,.12) 55%,rgba(255,255,255,.2));
  box-shadow:inset 0 0 0 calc(var(--u)*1.5) rgba(255,255,255,.45),inset 0 calc(var(--u)*-8) calc(var(--u)*18) rgba(255,255,255,.12),0 calc(var(--u)*6) calc(var(--u)*20) rgba(0,0,0,.12);
  -webkit-backdrop-filter:blur(6px) saturate(1.4);backdrop-filter:blur(6px) saturate(1.4);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .25s,transform .12s;-webkit-tap-highlight-color:transparent}
.key b{font:300 calc(var(--u)*72)/1 var(--ios);display:block}
.key small{font:600 calc(var(--u)*19)/1 var(--ios);letter-spacing:.22em;margin-top:calc(var(--u)*4);margin-right:-.22em}
.key.zero b{margin-bottom:calc(var(--u)*8)}
.key.down{background:rgba(255,255,255,.62);transition:none}
.key:focus-visible,.pin .txt:focus-visible{outline:3px solid #fff;outline-offset:3px}
.pin .txt{background:none;border:0;color:#fff;font:400 calc(var(--u)*30)/1 var(--ios);cursor:pointer;padding:calc(var(--u)*14) calc(var(--u)*20);transform:translate(-50%,-50%)}
.pisland{position:absolute;background:#000;border-radius:999px;display:flex;align-items:center;justify-content:space-between;box-sizing:border-box;pointer-events:none;z-index:6;
  opacity:0;transition:all .4s cubic-bezier(.3,1.25,.5,1)}
.pisland.on{opacity:1}
.pisland svg{height:56%;width:auto;flex:none}
.pisland .face{transition:opacity .3s}
@media (prefers-reduced-motion: reduce){.lock,.pin,.pisland{transition-duration:.01s}.pin .dots.shake{animation:none}}
@media (prefers-reduced-motion: reduce){.app,.search{transition-duration:.01s}.jiggle .tile,.jiggle .badge,.eq i{animation:none}}
</style>
</head>
<body>

<div class="phone" id="phone" aria-label="아이폰 홈 화면 프로토타입"></div>

<script>
const W=900,H=1840, SX=47,SY=46,SW=806,SH=1749;
const phone=document.getElementById('phone');
const icons=[
 ["facetime","FaceTime",110,634,"#1c1c1e","#fff"],["calendar","캘린더",296,634,"#fff","#000"],["photos","사진",482,634,"#fff","#000"],["camera","카메라",668,634,"#000","#fff"],
 ["netflix","Netflix",112,832,"#000","#fff"],["dict","네이버 사전",298,832,"#fff","#000"],["everytime","에브리타임",483,832,"#fff","#000"],["cgv","CGV",668,832,"#fff","#000"],
 ["notes","메모",108,1016,"#fffdf6","#000"],["maps","지도",294,1016,"#eef2ec","#000"],["instagram","Instagram",480,1016,"#fff","#000"],["naver","네이버",666,1016,"#fff","#000"],
 ["cafe","네이버 카페",112,1214,"#fff","#000"],
 ["phone","전화",120,1594,"#fff","#000"],["safari","Safari",298,1594,"#fff","#000"],["messages","메시지",475,1594,"#fff","#000"],["kakao","카카오톡",652,1594,"#fff","#000"]
].map(([id,name,x,y,bg,fg])=>({id,name,x,y,w:128,h:128,bg,fg}));
const extraApps={music:{id:"music",name:"음악",x:142,y:260,w:96,h:96,bg:"#fff",fg:"#000"},reminders:{id:"reminders",name:"미리 알림",x:510,y:260,w:0,h:0,bg:"#fff",fg:"#000"}};

function place(el,x,y,w,h){Object.assign(el.style,{left:x/W*100+'%',top:y/H*100+'%',width:w/W*100+'%',height:h/H*100+'%'});return el}
function crop(el,x,y,w,h){el.classList.add('crop');el.style.backgroundSize=`${W/w*100}% ${H/h*100}%`;el.style.backgroundPosition=`${x/(W-w)*100}% ${y/(H-h)*100}%`;return el}
function mk(cls,parent=phone){const d=document.createElement('div');if(cls)d.className=cls;parent.appendChild(d);return d}
function resize(){phone.style.setProperty('--u',phone.getBoundingClientRect().width/W+'px')}
new ResizeObserver(resize).observe(phone);
const fullMQ=matchMedia('(max-width: 600px)');
function layout(){
  const full=fullMQ.matches;document.body.classList.toggle('full',full);
  document.body.classList.toggle('standalone',!!(navigator.standalone||matchMedia('(display-mode: standalone)').matches));
  if(full){const vw=innerWidth,vh=innerHeight,u=Math.min(vw/SW,vh/SH);
    Object.assign(phone.style,{width:W*u+'px',height:H*u+'px',left:((vw-SW*u)/2-SX*u)+'px',top:((vh-SH*u)/2-SY*u)+'px'})}
  else Object.assign(phone.style,{width:'',height:'',left:'',top:''});
  resize()}
addEventListener('resize',layout);fullMQ.addEventListener?.('change',layout);layout();
/* the drawn status bar (time, signal, battery) shows only inside the phone frame */
const statusBar=crop(place(mk('frame-only'),140,80,650,62),140,80,650,62);statusBar.style.pointerEvents='none';

/* icon tiles */
const tiles={};
icons.forEach(ic=>{const t=crop(place(mk('tile'),ic.x,ic.y,ic.w,ic.h),ic.x,ic.y,ic.w,ic.h);
  t.tabIndex=0;t.setAttribute('role','button');t.setAttribute('aria-label',ic.name+' 열기');t.style.animationDelay=(-Math.random()*.28)+'s';tiles[ic.id]=t;bindPress(t,()=>openApp(ic,t))});
const badge=crop(place(mk('badge'),721,1567,88,54),721,1567,88,54);badge.style.animationDelay=tiles.kakao.style.animationDelay;

/* music widget */
let playing=false;
const musicHit=place(mk('hit'),108,228,316,312);musicHit.tabIndex=0;musicHit.setAttribute('aria-label','음악 열기');
const pill=place(mk('pill'),142,454,136,54);pill.hidden=true;
pill.innerHTML='<svg viewBox="0 0 22 24"><rect x="2" y="2" width="6" height="20" rx="1.5" fill="#fff"/><rect x="14" y="2" width="6" height="20" rx="1.5" fill="#fff"/></svg>Pause';
const eq=place(mk('eq'),356,258,40,42);eq.hidden=true;eq.innerHTML='<i></i><i></i><i></i><i></i>';
const playHit=place(mk('hit'),142,454,136,54);playHit.tabIndex=0;playHit.setAttribute('role','button');playHit.setAttribute('aria-label','재생');
bindPress(playHit,()=>{playing=!playing;pill.hidden=!playing;eq.hidden=!playing;playHit.setAttribute('aria-label',playing?'일시정지':'재생')},{noDim:true});
bindPress(musicHit,()=>openApp(extraApps.music,musicHit),{noDim:true,long:false});

/* reminders widget */
const remHit=place(mk('hit'),478,228,314,316);remHit.tabIndex=0;remHit.setAttribute('aria-label','미리 알림 열기');
bindPress(remHit,()=>openApp(extraApps.reminders,remHit),{noDim:true,long:false});
const count=place(mk('count'),690,254,72,56);count.hidden=true;let left=27;
[347,416,486].forEach(cy=>{
  const fade=place(mk('fade'),562,cy-24,210,48);
  const chk=place(mk('check'),510,cy-21,42,42);chk.innerHTML='<svg viewBox="0 0 20 20"><path d="M4.5 10.5l3.6 3.6 7.4-8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const h=place(mk('hit'),498,cy-32,280,64);h.tabIndex=0;h.setAttribute('role','checkbox');h.setAttribute('aria-checked','false');h.setAttribute('aria-label','할 일 완료');
  bindPress(h,()=>{const on=!chk.classList.contains('on');chk.classList.toggle('on',on);fade.classList.toggle('on',on);h.setAttribute('aria-checked',on);
    left+=on?-1:1;count.hidden=left===27;count.textContent=left},{noDim:true,long:false});
});

/* search pill */
const searchHit=place(mk('hit'),374,1455,152,58);searchHit.tabIndex=0;searchHit.setAttribute('aria-label','검색');searchHit.style.borderRadius='99px';
bindPress(searchHit,openSearch,{noDim:true,long:false});

/* empty wallpaper ends edit mode */
phone.addEventListener('pointerdown',e=>{if(e.target===phone&&phone.classList.contains('jiggle'))endEdit()});

/* screen layer (app + search live inside the rounded screen) */
const screen=place(mk('screen'),SX,SY,SW,SH);
const island=crop(place(mk('frame-only'),326,73,248,74),326,73,248,74);island.style.borderRadius='99px';island.style.zIndex=5;island.style.pointerEvents='none';
const done=document.createElement('button');done.className='done';done.textContent='완료';done.hidden=true;screen.appendChild(done);done.onclick=endEdit;

function bindPress(el,onTap,opt={}){
  let timer=null,sx=0,sy=0,armed=false;
  el.addEventListener('pointerdown',e=>{if(e.button)return;armed=true;sx=e.clientX;sy=e.clientY;if(!opt.noDim)el.classList.add('pressed');
    if(opt.long!==false)timer=setTimeout(()=>{armed=false;el.classList.remove('pressed');startEdit()},520)});
  el.addEventListener('pointermove',e=>{if(armed&&Math.hypot(e.clientX-sx,e.clientY-sy)>12){armed=false;clearTimeout(timer);el.classList.remove('pressed')}});
  const end=()=>{clearTimeout(timer);el.classList.remove('pressed')};
  el.addEventListener('pointerleave',()=>{armed=false;end()});
  el.addEventListener('pointercancel',()=>{armed=false;end()});
  el.addEventListener('pointerup',()=>{end();if(armed){armed=false;if(phone.classList.contains('jiggle'))return;onTap()}});
  el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();onTap()}});
  el.addEventListener('contextmenu',e=>e.preventDefault());
}
function startEdit(){if(currentApp)return;phone.classList.add('jiggle');done.hidden=false;if(navigator.vibrate)try{navigator.vibrate(12)}catch(_){}}
function endEdit(){phone.classList.remove('jiggle');done.hidden=true}

/* open / close an app with the iOS zoom */
let currentApp=null;
function rectInScreen(el){const r=el.getBoundingClientRect(),s=screen.getBoundingClientRect();return{x:r.left-s.left,y:r.top-s.top,w:r.width,h:r.height,sw:s.width,sh:s.height}}
function iconTransform(r){const w=r.w||r.sw*.15,h=r.h||w;return`translate(${r.x}px,${r.y}px) scale(${w/r.sw},${h/r.sh})`}
function openApp(ic,fromEl){
  if(currentApp)return;closeSearch(true);
  const app=document.createElement('div');app.className='app';app.style.background=ic.bg;app.style.color=ic.fg;
  const iconHtml=ic.w?`<span class="bigicon crop"></span>`:'';
  app.innerHTML=`<div class="time">9:41</div><div class="content">${iconHtml}<h2></h2><p>이 앱의 다음 화면을 보내주시면 여기에 연결할게요</p></div><div class="homebar" aria-label="홈으로" role="button" tabindex="0"><span></span></div>`;
  app.querySelector('h2').textContent=ic.name;
  if(ic.w){const b=app.querySelector('.bigicon');b.style.backgroundSize=`${W/ic.w*100}% ${H/ic.h*100}%`;b.style.backgroundPosition=`${ic.x/(W-ic.w)*100}% ${ic.y/(H-ic.h)*100}%`}
  const content=app.querySelector('.content');content.style.opacity=0;
  screen.insertBefore(app,done);
  const r=rectInScreen(fromEl);app._r=r;app._el=fromEl;
  app.style.transition='none';app.style.transform=iconTransform(r);app.style.borderRadius='22.6%';
  app.getBoundingClientRect();app.style.transition='';
  requestAnimationFrame(()=>{app.style.transform='none';app.style.borderRadius='0';content.style.opacity=1});
  currentApp=app;
  if(ic.id==='kakao')setTimeout(()=>badge.classList.add('gone'),300);
  const bar=app.querySelector('.homebar');let y0=null;
  bar.addEventListener('pointerdown',e=>{y0=e.clientY;bar.setPointerCapture(e.pointerId);app.style.transition='none'});
  bar.addEventListener('pointermove',e=>{if(y0==null)return;const dy=Math.min(0,e.clientY-y0),k=Math.max(.6,1+dy/600);app.style.transform=`translate(${(1-k)*r.sw/2}px,${(1-k)*r.sh/2+dy*.4}px) scale(${k})`;app.style.borderRadius=(1-k)*200+'px'});
  bar.addEventListener('pointerup',e=>{const dy=e.clientY-y0;y0=null;app.style.transition='';if(dy<-50||Math.abs(dy)<6)closeApp();else{app.style.transform='none';app.style.borderRadius='0'}});
  bar.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')closeApp()});
}
function closeApp(){const app=currentApp;if(!app)return;currentApp=null;
  app.querySelector('.content').style.opacity=0;app.style.transform=iconTransform(rectInScreen(app._el));app.style.borderRadius='22.6%';
  setTimeout(()=>{app.style.opacity=0;app.style.transition+=' ,opacity .12s'},330);setTimeout(()=>app.remove(),470)}

/* search */
let searchEl=null;
function openSearch(){if(currentApp||searchEl)return;
  const s=document.createElement('div');s.className='search';
  s.innerHTML=`<div class="sfield"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="#fff" stroke-width="2.4"/><path d="M15.5 15.5l5 5" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg><input id="q" type="search" placeholder="검색" aria-label="앱 검색" autocomplete="off"><button type="button">취소</button></div><div class="slabel">Siri 제안</div><div class="sgrid"></div>`;
  screen.insertBefore(s,done);searchEl=s;
  const grid=s.querySelector('.sgrid'),q=s.querySelector('input');
  const render=()=>{const t=q.value.trim().toLowerCase();const list=icons.filter(ic=>!t||ic.name.toLowerCase().includes(t)||ic.id.includes(t)).slice(0,t?12:8);
    grid.innerHTML='';s.querySelector('.slabel').textContent=t?'앱':'Siri 제안';
    if(!list.length){grid.innerHTML='<div class="sempty" style="grid-column:1/-1">“'+q.value.replace(/[<&]/g,'')+'”와 일치하는 앱이 없어요</div>';return}
    list.forEach(ic=>{const b=document.createElement('button');b.className='sitem';b.type='button';b.innerHTML='<span class="crop"></span><span></span>';
      const ico=b.firstChild;ico.style.backgroundSize=`${W/ic.w*100}% ${H/ic.h*100}%`;ico.style.backgroundPosition=`${ic.x/(W-ic.w)*100}% ${ic.y/(H-ic.h)*100}%`;
      b.lastChild.textContent=ic.name;b.onclick=()=>{closeSearch(true);openApp(ic,tiles[ic.id])};grid.appendChild(b)})};
  q.addEventListener('input',render);render();
  s.querySelector('.sfield button').onclick=()=>closeSearch();
  s.addEventListener('pointerdown',e=>{if(e.target===s||e.target===grid)closeSearch()});
  requestAnimationFrame(()=>{s.classList.add('on');try{q.focus({preventScroll:true})}catch(_){}});
}
function closeSearch(now){const s=searchEl;if(!s)return;searchEl=null;if(now){s.remove();return}s.classList.remove('on');setTimeout(()=>s.remove(),260)}

/* ---------- lock screen ---------- */
function placeS(el,x,y,w,h){Object.assign(el.style,{left:(x-SX)/SW*100+'%',top:(y-SY)/SH*100+'%',width:w/SW*100+'%',height:h/SH*100+'%'});return el}
const lock=document.createElement('div');lock.className='lock';lock.setAttribute('aria-label','잠금 화면. 위로 쓸어올려 열기');screen.insertBefore(lock,done);
const torch=placeS(mk('torch',lock),139,1578,116,116);
torch.innerHTML='<svg viewBox="0 0 24 24"><path d="M8 2h8v4l-2 4v11a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1V10L8 6z" fill="#111"/><circle cx="12" cy="13" r="1.4" fill="#fff"/></svg>';
const lockHits=[
  {x:77,y:1036,w:744,h:130,act:()=>askPin(()=>openApp(icons.find(i=>i.id==='phone'),tiles.phone)),label:'엄마 부재중 전화'},
  {x:77,y:1184,w:744,h:128,act:null,label:'알림'},
  {x:77,y:1342,w:744,h:128,act:()=>askPin(()=>openApp(icons.find(i=>i.id==='kakao'),tiles.kakao)),label:'태형 선배 카카오톡 메시지'},
  {x:139,y:1578,w:116,h:116,round:1,act:()=>torch.classList.toggle('on'),label:'손전등'},
  {x:643,y:1578,w:116,h:116,round:1,act:()=>unlock(()=>openApp(icons.find(i=>i.id==='camera'),tiles.camera)),label:'카메라'}
];
lockHits.forEach(h=>{const el=placeS(mk('lk'+(h.round?' round':''),lock),h.x,h.y,h.w,h.h);el.setAttribute('aria-label',h.label);el.setAttribute('role','button');el.tabIndex=0;el._act=h.act;
  el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();(h.act||bounce)()}})});
let locked=true;
function bounce(){lock.animate([{transform:'translateY(0)'},{transform:'translateY(-5%)'},{transform:'translateY(0)'}],{duration:420,easing:'ease-out'})}
function unlock(then){if(!locked)return;locked=false;torch.classList.remove('on');lock.style.transition='';lock.style.transform='';lock.style.opacity='';lock.classList.add('gone');lock.setAttribute('aria-hidden','true');relockZone.hidden=false;
  if(then)setTimeout(then,380)}
function relock(){if(locked)return;resetPin();if(currentApp)closeApp();closeSearch(true);endEdit();locked=true;relockZone.hidden=true;lock.removeAttribute('aria-hidden');lock.classList.remove('gone')}
{let y0=null,t0=0,moved=false;
 lock.addEventListener('pointerdown',e=>{if(e.button)return;y0=e.clientY;t0=performance.now();moved=false;lock.setPointerCapture(e.pointerId);lock.style.transition='none'});
 lock.addEventListener('pointermove',e=>{if(y0==null)return;const dy=e.clientY-y0;if(Math.abs(dy)>8)moved=true;if(dy<0){lock.style.transform=`translateY(${dy}px)`;lock.style.opacity=Math.max(.3,1+dy/700)}});
 lock.addEventListener('pointerup',e=>{if(y0==null)return;const dy=e.clientY-y0,dt=performance.now()-t0,hgt=lock.getBoundingClientRect().height;y0=null;lock.style.transition='';
   if(dy<-hgt*.18||(dy<-40&&dt<250)){askPin();return}
   lock.style.transform='';lock.style.opacity='';
   if(!moved){const hit=document.elementsFromPoint(e.clientX,e.clientY).find(n=>n.classList&&n.classList.contains('lk'));if(hit&&hit._act)hit._act();else bounce()}});
 lock.addEventListener('pointercancel',()=>{y0=null;lock.style.transition='';lock.style.transform='';lock.style.opacity=''});
}
/* ---------- passcode ---------- */
const PASSCODE=null; // 예: '123456'으로 바꾸면 그 번호만 열려요. null이면 아무 6자리나 열려요.
const pin=document.createElement('div');pin.className='pin';pin.setAttribute('aria-label','암호 입력');screen.insertBefore(pin,lock);
const prompt=placeS(mk('prompt',pin),SX,SY+300,SW,60);prompt.style.width='';prompt.textContent='암호 입력';
const dotsEl=placeS(mk('dots',pin),SX,SY+431,SW,26);dotsEl.style.width='';dotsEl.innerHTML='<i></i>'.repeat(6);
const keyX=[194,403,611],keyY=[679,876,1072,1269],letters=['','ABC','DEF','GHI','JKL','MNO','PQRS','TUV','WXYZ'];
function keyAt(d,x,y){const b=document.createElement('button');b.type='button';b.className='key'+(d===0?' zero':'');b.setAttribute('aria-label',String(d));
  b.innerHTML=`<b>${d}</b>`+(d>1?`<small>${letters[d-1]}</small>`:(d===1?'<small>&nbsp;</small>':''));
  b.style.left=x/SW*100+'%';b.style.top=y/SH*100+'%';pin.appendChild(b);
  b.addEventListener('pointerdown',e=>{e.preventDefault();b.classList.add('down');press(d)});
  const up=()=>b.classList.remove('down');b.addEventListener('pointerup',up);b.addEventListener('pointerleave',up);b.addEventListener('pointercancel',up);
  b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();press(d)}})}
[1,2,3,4,5,6,7,8,9].forEach((d,i)=>keyAt(d,keyX[i%3],keyY[Math.floor(i/3)]));keyAt(0,keyX[1],keyY[3]);
function txtBtn(label,x,y){const b=document.createElement('button');b.type='button';b.className='txt';b.textContent=label;b.style.left=x/SW*100+'%';b.style.top=y/SH*100+'%';pin.appendChild(b);return b}
txtBtn('긴급 상황',194,1607);
const cancelBtn=txtBtn('취소',611,1607);
cancelBtn.addEventListener('click',()=>{if(code.length){code=code.slice(0,-1);drawDots()}else cancelPin()});
/* expanded Dynamic Island with lock + Face ID */
const pis=place(mk('pisland'),326,73,248,74);
pis.innerHTML='<svg class="lk" viewBox="0 0 20 24"><path class="shackle" d="M5 10V7a5 5 0 0 1 10 0v3" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" style="transition:transform .3s;transform-origin:15px 10px"/><rect x="2" y="10" width="16" height="13" rx="3" fill="#fff"/></svg><svg class="face" viewBox="0 0 24 24" fill="none" stroke="#5ee07a" stroke-width="2" stroke-linecap="round"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M8.5 9v1.5M15.5 9v1.5M12 9v4.5h-1M9 16.5c1.8 1.4 4.2 1.4 6 0"/></svg>';
function islandOpen(on){if(on){place(pis,253,68,394,100);pis.style.padding='0 calc(var(--u)*34)';pis.classList.add('on')}else{place(pis,326,73,248,74);pis.style.padding='0';pis.classList.remove('on')}}
let code='',pinOpen=false,pendingThen=null;
function drawDots(){[...dotsEl.children].forEach((d,i)=>d.classList.toggle('f',i<code.length));cancelBtn.textContent=code.length?'삭제':'취소'}
function askPin(then){if(!locked||pinOpen)return;pendingThen=then||null;pinOpen=true;code='';drawDots();torch.classList.remove('on');
  lock.style.transition='';lock.style.transform='';lock.style.opacity='';lock.classList.add('gone');lock.setAttribute('aria-hidden','true');
  pin.classList.remove('out');pin.classList.add('on');islandOpen(true)}
function cancelPin(){if(!pinOpen)return;pinOpen=false;pendingThen=null;pin.classList.remove('on');islandOpen(false);lock.removeAttribute('aria-hidden');lock.classList.remove('gone')}
function resetPin(){pinOpen=false;code='';drawDots();pin.classList.remove('on','out');islandOpen(false)}
function press(d){if(!pinOpen||code.length>=6)return;code+=d;drawDots();
  if(code.length===6)setTimeout(()=>{if(PASSCODE&&code!==PASSCODE){dotsEl.classList.remove('shake');void dotsEl.offsetWidth;dotsEl.classList.add('shake');if(navigator.vibrate)try{navigator.vibrate([30,40,30])}catch(_){}setTimeout(()=>{code='';drawDots()},420);return}
    pis.querySelector('.shackle').style.transform='rotate(-35deg) translateY(-2px)';pis.querySelector('.face').style.opacity=0;
    setTimeout(()=>{pin.classList.add('out');islandOpen(false);pinOpen=false;locked=false;relockZone.hidden=false;
      setTimeout(()=>{pin.classList.remove('on','out');pis.querySelector('.shackle').style.transform='';pis.querySelector('.face').style.opacity='';code='';drawDots();const t=pendingThen;pendingThen=null;if(t)t()},420)},330)},140)}
document.addEventListener('keydown',e=>{if(pinOpen&&/^[0-9]$/.test(e.key))press(+e.key);if(pinOpen&&e.key==='Backspace'&&code.length){code=code.slice(0,-1);drawDots()}});

/* pull down from the top edge of the home screen to lock again */
const relockZone=place(mk('relock'),47,46,806,110);relockZone.hidden=true;
{let y0=null;relockZone.addEventListener('pointerdown',e=>{y0=e.clientY;relockZone.setPointerCapture(e.pointerId)});
 relockZone.addEventListener('pointerup',e=>{if(y0!=null&&e.clientY-y0>50)relock();y0=null});}

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&pinOpen){cancelPin();return}if(e.key==='Escape'&&locked){askPin();return}if(e.key==='Escape'){if(currentApp)closeApp();else if(searchEl)closeSearch();else endEdit()}});
</script>
</body>
